version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: productividad_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ../sql/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 10s
      retries: 10
      interval: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_productividad
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: monitoreodb_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: productividad_corporativa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      timeout: 5s
      retries: 6
      interval: 5s

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard
    container_name: monitoreodb_dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  watcher:
    build:
      context: ..
      dockerfile: Dockerfile.watcher
    container_name: monitoreodb_watcher
    environment:
      API_URL: http://api:8000
      WATCH_DIR: /watch
      STATE_FILE: /state/watcher_state.json
    volumes:
      - ../logs:/watch
      - watcher_state:/state
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  watcher_state:

networks:
  app_network:
    driver: bridge
