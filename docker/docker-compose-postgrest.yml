version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: productividad_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 10s
      retries: 10
      interval: 10s
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"

  postgrest:
    image: postgrest/postgrest:latest
    container_name: postgrest_api
    environment:
      PGRST_DB_URI: postgresql://api_user:api_pass@postgres:5432/productividad_corporativa
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: api_user
      PGRST_JWT_SECRET: your-secret-key-change-in-production
      PGRST_OPENAPI_SERVER_PROXY_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_productividad
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
    driver: bridge
