version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: productividad_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: productividad_corporativa
      MYSQL_USER: usuario_bd
      MYSQL_PASSWORD: password_segura
      TZ: 'America/Mexico_City'
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_productividad
    environment:
      PMA_HOST: mysql
      PMA_USER: usuario_bd
      PMA_PASSWORD: password_segura
      PMA_ROOT_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
